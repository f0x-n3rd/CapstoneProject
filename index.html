<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login/login.css">
</head>
<body>

<div class="login-card">
    <p class="logo-box">LOGO</p>
    <p class="system-title">SYSTEM TITLE</p>
    <p class="subtitle">Log into your account</p>

    <form id="loginForm">
        <div class="input-group">
            <input type="email" id="email" name="email" placeholder="Email@gmail.com" required>
        </div>

        <div class="input-group">
            <input type="password" id="password" class="password-input" placeholder="Password" required>

            <button
                type="button" class="toggle-password" id="togglePassword">
                <img src="assets_log/hides.png" id="eyeIcon" alt="Toggle Password">
            </button>
       
        </div>
        <button type="submit" class="signin-btn">Sign In</button>
    </form>

    <div class="footer-text">New resident? <a href="register.html">Create account</a></div>
</div>

<script src="login/login.js"></script>
</body>
</html>
